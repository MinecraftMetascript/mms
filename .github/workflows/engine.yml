name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

defaults:
  run:
    working-directory: engine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | grep -v syntax/parser)"
      # ANTLR's generated parser trips vet's unreachable-code check.
      - run: go vet $(go list ./... | grep -v /syntax/parser)
      - run: go test ./...
      - name: WASM build
        run: GOOS=js GOARCH=wasm go build -o mms.wasm ./cmd/mms-wasm && ls -l mms.wasm

  spec-pack:
    # The committed pack must match what specgen produces from the pinned inputs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - run: go run ./specgen
      - run: git diff --exit-code -- spec/data

  grammar:
    # The committed parser must match what ANTLR generates from the grammar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gen.sh
        working-directory: engine/syntax
      - run: git diff --exit-code -- syntax/parser

  vanilla:
    # Every vanilla 26.3 data file must validate against the spec pack's
    # types; this tests the type model against ground truth.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Fetch vanilla 26.3 data (mcmeta 26.3-data)
        run: |
          git init -q "$RUNNER_TEMP/mcmeta"
          cd "$RUNNER_TEMP/mcmeta"
          git fetch -q --depth 1 https://github.com/misode/mcmeta.git 538b2b167248c648b2198f2c0d56eced10dfc0cf
          git checkout -q FETCH_HEAD
      - run: MMS_VANILLA="$RUNNER_TEMP/mcmeta" go test ./sema ./project -run "TestVanillaValidates|TestVanillaParity" -v
