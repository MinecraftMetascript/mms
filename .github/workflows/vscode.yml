name: vscode

on:
  push:
    branches: [main]
    paths: ["editors/vscode/**", ".github/workflows/vscode.yml"]
  pull_request:
    paths: ["editors/vscode/**", ".github/workflows/vscode.yml"]

defaults:
  run:
    working-directory: editors/vscode

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package
