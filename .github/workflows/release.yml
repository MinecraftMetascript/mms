name: release

# Pushing a tag such as v1.0.0 builds the CLI for every platform and the
# VS Code extension (a universal .vsix plus one per platform with mms
# bundled), and publishes them as a GitHub release. The extension also goes
# to the VS Code Marketplace and Open VSX, as version 1.0.0, when the
# VSCE_PAT and OVSX_PAT secrets are set (scripts/publish.mjs). Merges to main
# publish pre-releases (vscode-prerelease.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Build
        working-directory: engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="mms-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/mms$ext" ./cmd/mms
          cp ../README.md THIRD_PARTY_NOTICES.txt "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: engine/dist/*.*z*

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Install the npm workspace
        working-directory: .
        run: npm ci
      # The extension's version is the tag's: v1.0.0 -> 1.0.0.
      - name: Set the version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      # The universal mms-<version>.vsix, which runs mms from mms.path or PATH.
      - run: npm run package
      # One mms-<target>-<version>.vsix per platform, with mms bundled.
      - run: node scripts/package-targets.mjs
        env:
          MMS_VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: editors/vscode/*.vsix

  publish:
    needs: [binaries, vscode]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MMS $GITHUB_REF_NAME" --generate-notes

  # The same .vsix files, to the extension stores. Each store is skipped
  # while its token secret is not set.
  stores:
    needs: [vscode]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the npm workspace
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: vsix
      - name: Publish
        run: node editors/vscode/scripts/publish.mjs vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
