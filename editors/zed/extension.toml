id = "minecraft-metascript"
name = "Minecraft Metascript"
description = "Minecraft Metascript (.mms) support: highlighting plus diagnostics, completion, formatting and quick fixes from the MMS language server."
version = "1.0.0"
schema_version = 1
authors = ["Minecraft Metascript contributors"]
repository = "https://github.com/MinecraftMetascript/mms"

# The grammar lives in this repository. `rev` must be a commit on main that
# contains editors/tree-sitter-mms; bump it whenever the grammar changes
# (editors/zed/README.md, "Changing the grammar").
[grammars.mms]
repository = "https://github.com/MinecraftMetascript/mms"
rev = "0815c34abd5868966a48db3201d0c2816dd9ba49"
path = "editors/tree-sitter-mms"

[language_servers.mms]
name = "MMS Language Server"
languages = ["Minecraft Metascript"]

[language_servers.mms.language_ids]
"Minecraft Metascript" = "mms"
